[project]
name = "coding-agent-v2"
version = "0.1.0"
description = "A local coding agent that proves its result"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent = "agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S603, S607: commands are argument lists and program names come from PATH on purpose.
# UP036: the version check must stay, so an old Python gets a clear line.
ignore = ["S603", "S607", "UP036"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.11"
cache_dir = "/tmp/mypy"
